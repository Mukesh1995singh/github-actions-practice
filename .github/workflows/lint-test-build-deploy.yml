name: Lint Test Build Deploy Pipeline

on:
  push:

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build

      - name: Deploy Application (Simulated)
        run: |
          echo "Deploying application to production..."
          echo "Application deployed successfully!"