name: Lint Test Build Pipeline

on:
  push:

permissions:
  contents: read
  issues: write

jobs:
  ci:
    name: Lint Test Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build

      - name: Create GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "CI Pipeline Failed" \
            --body "Build failed for commit ${{ github.sha }}"